name: validação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run openapi:validate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --tag elitehub-connect:${{ github.sha }} .
